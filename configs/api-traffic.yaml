# API traffic extract: only /api requests, written to out/api-traffic.txt and printed in the terminal.
pipeline:
  name: api-traffic
  source:
    type: file
    params: { path: data/access-small.log }
  stages:
    - type: parse
    - type: filter
      params: { field: path, op: startsWith, value: /api }
    - type: project
      params: { fields: [timestamp, method, path, status] }
  sink:
    type: file
    params: { path: out/api-traffic.txt, echo: true }   # echo: also print in the terminal
