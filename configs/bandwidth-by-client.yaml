# Bandwidth-by-client extract: who downloaded how many bytes (responses with a body only), written to out/bandwidth.txt and printed in the terminal.
pipeline:
  name: bandwidth-by-client
  source:
    type: file
    params: { path: data/access-small.log }
  stages:
    - type: parse
      onError: skip        # v5: malformed lines are skipped and counted
    - type: filter
      params: { field: bytes, op: ">", value: 0 }
    - type: project
      params: { fields: [clientIp, bytes] }
  sink:
    type: file
    params: { path: out/bandwidth.txt, echo: true }   # echo: also print in the terminal
