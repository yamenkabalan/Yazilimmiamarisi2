# Bandwidth-by-client extract: who downloaded how many bytes (responses with a body only).
pipeline:
  name: bandwidth-by-client
  source:
    type: file
    params: { path: data/access-small.log }
  stages:
    - type: parse
    - type: filter
      params: { field: bytes, op: ">", value: 0 }
    - type: project
      params: { fields: [clientIp, bytes] }
  sink:
    type: file
    params: { path: out/bandwidth.txt }
